# ProcessCore Python services behind Apache (included from the vhost:
#   Include /var/www/deploy/apache/processcore-services.conf
# in /etc/apache2/sites-available/000-default.conf, and in the TLS vhost when there is one).
# Needs: a2enmod proxy proxy_http headers
#
# Exposed:
#   /mcp/records      -> processcore_records_mcp  127.0.0.1:8701/mcp  (bearer token, scope 'records')
#   /mcp/activity     -> processcore_activity_mcp 127.0.0.1:8702/mcp  (bearer token, scope 'activity')
#   /assistant/stream -> assistant service   127.0.0.1:8765/stream (SSE; the session cookie authenticates)
# Never exposed: the actions MCP server (8703) and every other assistant route (8765).
#
# ProxyPass in vhost context is mapped before the DocumentRoot's .htaccess rewrites run,
# so the PHP router never sees these paths. Everything else still goes to the router.

<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120

    # MCP streamable HTTP (stateless JSON). The empty group keeps ProxyPassMatch from appending
    # the request path to the target (it does that when the target has no backreference).
    # mod_proxy forwards the Authorization header
    # unchanged; the services check the bearer token themselves.
    ProxyPassMatch        "^/mcp/records/?()$"  "http://127.0.0.1:8701/mcp$1" retry=0 timeout=60
    ProxyPassReverse      "/mcp/records"      "http://127.0.0.1:8701/mcp"
    ProxyPassMatch        "^/mcp/activity/?()$" "http://127.0.0.1:8702/mcp$1" retry=0 timeout=60
    ProxyPassReverse      "/mcp/activity"     "http://127.0.0.1:8702/mcp"

    # Server-sent events for the assistant: flush every packet, allow long-lived
    # streams, and never compress (compression buffers the stream).
    ProxyPass             "/assistant/stream" "http://127.0.0.1:8765/stream" flushpackets=on retry=0 timeout=600 keepalive=On
    ProxyPassReverse      "/assistant/stream" "http://127.0.0.1:8765/stream"
    SetEnvIf Request_URI "^/assistant/stream" no-gzip=1 dont-vary=1
    <Location "/assistant/stream">
        <IfModule mod_headers.c>
            Header set Cache-Control "no-cache"
            Header set X-Accel-Buffering "no"
        </IfModule>
    </Location>

    <Location "/mcp/">
        <IfModule mod_headers.c>
            Header set Cache-Control "no-store"
        </IfModule>
    </Location>
</IfModule>
