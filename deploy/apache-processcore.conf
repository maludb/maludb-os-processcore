# ProcessCore — an application beside the MaluDB Business OS kernel (mcp-and-api.md §7). Rendered by the kernel's installer
# (bin/app_install.php): {{APP_FQDN}} = processcore.<domain>, {{APP_DIR}} = /srv/apps/processcore, the ports from config/.env.
# Two virtual hosts: the public name for people (and the two proxied MCP servers), and a loopback port for the kernel's
# actions server and approval replays. The pretty-URL router lives in html/.htaccess, hence AllowOverride All.

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/processcore-error.log
	CustomLog ${APACHE_LOG_DIR}/processcore-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# The two read MCP servers under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard checks it
	# against loopback). Bearer auth is the servers' own: a person's token, the tenant's run token, or the kernel's.
	ProxyRequests Off
	ProxyPreserveHost Off
	ProxyPassMatch   "^/mcp/records/?()$"  "http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp$1" retry=0 timeout=60
	ProxyPassReverse "/mcp/records"        "http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp"
	ProxyPassMatch   "^/mcp/activity/?()$" "http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp$1" retry=0 timeout=60
	ProxyPassReverse "/mcp/activity"       "http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp"
	<IfModule mod_headers.c>
		<Location "/mcp/">
			Header set Cache-Control "no-store"
		</Location>
	</IfModule>
	# The standalone assistant's stream and actions server are NOT proxied here: beside the kernel the command bar runs
	# ProcessCore's expert in the kernel (html/assistant/message.php → the chat endpoint).
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/processcore-error.log
	CustomLog ${APACHE_LOG_DIR}/processcore-access.log combined
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
